name: Convert Debug APK to Signed Release

on:
  workflow_dispatch:

jobs:
  sign-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Debug APK from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Thiru468/pdf-craft --pattern "input.apk"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Remove Debug Mode & Rebuild
        run: |
          apktool d input.apk -o decoded -f
          sed -i 's/android:debuggable="true"/android:debuggable="false"/g' decoded/AndroidManifest.xml
          apktool b decoded -o unsigned.apk

      - name: Generate Keystore & Sign APK
        run: |
          keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias pdfcraft -storepass pdfcraft123 -keypass pdfcraft123 -dname "CN=PDF Craft, OU=Dev, O=TsApps, L=Chennai, ST=TN, C=IN"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 unsigned.apk aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:pdfcraft123 --key-pass pass:pdfcraft123 --out PDFCraft-Signed-Release.apk aligned.apk

      - name: Upload Signed APK & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: PDFCraft-Release-Output
          path: |
            PDFCraft-Signed-Release.apk
            release.jks
