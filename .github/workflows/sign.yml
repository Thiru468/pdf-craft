name: Convert Debug APK to Signed Release

on:
  workflow_dispatch:

jobs:
  sign-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Latest Apktool
        run: |
          sudo wget -q https://githubusercontent.com -O /usr/local/bin/apktool
          sudo wget -q https://github.com -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool

      - name: Decompile APK
        run: apktool d input.apk -o decoded -f

      - name: Remove Debuggable Flag
        run: sed -i 's/android:debuggable="true"//g' decoded/AndroidManifest.xml

      - name: Rebuild APK
        run: apktool b decoded -o unsigned.apk --use-aapt2

      - name: Align and Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 unsigned.apk aligned.apk
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key -storepass android123 -keypass android123 -dname "CN=App, OU=Dev, O=Org, L=City, S=State, C=IN"
          $BUILD_TOOLS/apksigner sign --ks release-key.jks --ks-key-alias my-key --ks-pass pass:android123 --key-pass pass:android123 --out signed-release.apk aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-output
          path: |
            signed-release.apk
            release-key.jks
